[server]
# Default endpoint remains backward compatible. Set profile="local" to select
# a named profile below, or pass --provider NAME to evo chat/code/doctor.
profile = "local"
base_url = "http://127.0.0.1:18997"
api_key = "no-key"
# Set this to an ID returned by: evo doctor
model = "local-model"
timeout_seconds = 600

[experiment]
database = "results/experiments.sqlite3"
sample_interval_seconds = 1.0
max_tokens = 256
temperature = 0.0
repetitions = 3
# Fixed base seed; each repetition increments it by one. Set to omit for server-default sampling.
seed = 42

[assistant]
max_tokens = 2048
temperature = 0.2
memory_limit = 8
history_messages = 16
max_history_chars = 40000
# Conservative context budget; set to the actual runtime context size.
context_window_tokens = 49152

[system]
prompt = "You are Evo, a careful local-first AI assistant. Be honest about uncertainty and distinguish evidence from inference."

# Global command-policy ceiling. Project-bound coding agents intersect this
# allowlist with components.command_policy.allowed_commands in the workspace's
# pinned configuration revision. Missing or invalid project policy denies
# project command execution. Allowlisting is not an OS-level sandbox.
[workspace]
root = "."
allowed_commands = [["python", "-m", "unittest"], ["pytest"]]

# Record the runtime conditions for every experiment. Fill in what you know;
# do not guess. model_file is optional but, if set, its SHA-256 is captured.
[run]
label = "qwen3.8-27b-baseline"
model_file = ""
runtime = "llama.cpp"
runtime_version = ""
launch_command = ""
context_size = 49152
kv_cache_k = "q4_0"
kv_cache_v = "q4_0"
gpu_layers = "all"
batch_size = 512
ubatch_size = 128
flash_attention = ""
notes = "Record desktop state and unusual background GPU use here."



# Registry-bound provider endpoints are separately allowlisted by exact origin.
# Loopback HTTP endpoints are handled by the fixed local-inference policy.
[security]
allowed_provider_origins = []

# Registry component secrets are resolved only from these operator-approved
# environment-variable names. Values never belong in AI Configuration records.
[secrets]
allowed_env_vars = []

# Compliance is a separate operator decision from endpoint allowlisting.
# Add one record per exact origin, adapter/interface, and approved use.
# [[provider_approvals]]
# origin = "https://api.example.com"
# adapter_id = "openai_compatible_chat"
# uses = ["chat_completion"]
# status = "approved"
# reviewed_at = "2026-11-23"
# terms_reference = "provider terms revision reviewed"
# data_handling_reference = "provider data-handling policy reviewed"

# Named OpenAI-compatible providers. Cloud providers are optional; no paid
# provider is required. Put API keys in environment variables, never here.
[providers.local]
# Empty profile inherits [server] settings. Add overrides only when needed.

# Example free-tier-compatible profile. Uncomment and set the provider's
# documented endpoint/model plus its API-key environment variable.
# [providers.example_cloud]
# base_url = "https://api.example.com/v1"
# model = "provider-model-id"
# api_key_env = "EXAMPLE_CLOUD_API_KEY"
# timeout_seconds = 600

# P3.5 dispatch admission is opt-in. Leave disabled until the P3.5 acceptance gate closes.
[dispatch]
enabled = false

# Every Registry-bound model integration
# requires an explicit budget. Loopback endpoints additionally require an
# operator-owned resource profile. The integration_id is derived from the
# exact adapter, normalized endpoint origin, and model identifier; obtain it
# from the bound participant/runtime diagnostics rather than guessing.
#
# [[dispatch.provider_budgets]]
# integration_id = "integration_<32-hex-character-id>"
# maximum_requests_per_utc_day = 100
# maximum_output_tokens_per_invocation = 4096
# maximum_reserved_output_tokens_per_utc_day = 65536
#
# Loopback-only profile. Values are operator estimates for the exact
# integration, not workspace-controlled claims. GPU estimates must include
# the incremental/cold-load memory behavior of the model server.
# [[dispatch.local_resource_profiles]]
# integration_id = "integration_<32-hex-character-id>"
# compute_mode = "gpu"                 # cpu, gpu, or mixed
# cpu_cores = 1.0
# ram_mib = 2048
# gpu_vram_mib = 4096
# memory_mode = "persistent_incremental" # or cold_load
# maximum_gpu_temperature_c = 85
